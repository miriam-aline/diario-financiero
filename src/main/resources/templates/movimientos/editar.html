<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Editar movimiento')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <div th:replace="~{fragments/layout :: backdrop}"></div>

    <div class="app-main">
        <header th:replace="~{fragments/layout :: mobilebar('Editar movimiento')}"></header>

        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Editar movimiento</h1>
                    <p class="page-subtitle">Actualiza los datos del registro seleccionado</p>
                </div>
                <div class="page-actions">
                    <a th:href="@{/movimientos}" class="btn btn-ghost btn-sm">← Volver a movimientos</a>
                </div>
            </div>

            <section class="card section-card">
                <form th:action="@{/movimientos/{id}/editar(id=${movimientoId})}"
                      th:object="${movimientoForm}"
                      method="post"
                      class="quick-form"
                      novalidate>
                    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-error" role="alert">
                        <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                    </div>

                    <div class="form-grid">
                        <div class="field">
                            <label for="tipo">Tipo</label>
                            <select id="tipo" th:field="*{tipo}" required>
                                <option th:each="t : ${tiposMovimiento}"
                                        th:value="${t}"
                                        th:text="${t.etiqueta}"></option>
                            </select>
                            <span class="field-error" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></span>
                        </div>

                        <div class="field">
                            <label for="monto">Monto (MXN)</label>
                            <input id="monto" type="number" step="0.01" min="0.01" th:field="*{monto}" required>
                            <span class="field-error" th:if="${#fields.hasErrors('monto')}" th:errors="*{monto}"></span>
                        </div>

                        <div class="field field-wide">
                            <label for="descripcion">Descripción</label>
                            <input id="descripcion" type="text" maxlength="255" th:field="*{descripcion}" required>
                            <span class="field-error" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></span>
                        </div>

                        <div class="field">
                            <label for="fecha">Fecha</label>
                            <input id="fecha" type="date" th:field="*{fecha}" required>
                            <span class="field-error" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}"></span>
                        </div>

                        <div class="field">
                            <label for="categoriaId">Categoría</label>
                            <select id="categoriaId" th:field="*{categoriaId}" required>
                                <option value="">Selecciona una categoría</option>
                                <option th:each="cat : ${categorias}"
                                        th:value="${cat.id}"
                                        th:text="${cat.nombre}"></option>
                            </select>
                            <span class="field-error" th:if="${#fields.hasErrors('categoriaId')}" th:errors="*{categoriaId}"></span>
                        </div>

                        <div class="field">
                            <label for="cuentaId">Cuenta</label>
                            <select id="cuentaId" th:field="*{cuentaId}" required>
                                <option value="">Selecciona una cuenta</option>
                                <option th:each="cta : ${cuentas}"
                                        th:value="${cta.id}"
                                        th:text="${cta.nombre + ' (' + cta.tipo.etiqueta + ')'}"></option>
                            </select>
                            <span class="field-error" th:if="${#fields.hasErrors('cuentaId')}" th:errors="*{cuentaId}"></span>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Guardar cambios</button>
                        <a th:href="@{/movimientos}" class="btn btn-ghost">Cancelar</a>
                    </div>
                </form>
            </section>
        </main>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
</body>
</html>
